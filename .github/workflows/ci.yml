name: CI

# Replaces the previous pre-commit.yml / ci.yml / deploy.yml, which
# duplicated the same lint+test+build steps across three files and each
# included a Vercel CLI deploy step that never ran (no VERCEL_TOKEN /
# VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets are configured on this repo).
# Deployment is handled entirely by Vercel's own GitHub App integration,
# independent of this workflow — this file is just the quality gate.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: # Allow manual trigger

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test:ci

      - name: Build
        run: npm run build
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key-for-build' }}

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Regression tests (Playwright)
        run: npm run test:e2e
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'dummy-key-for-build' }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
